<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
    <h2>Feedback Form</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
        {% if messages %}
  {% for message in messages %}
    <div style="color: green;">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}
    </form>
</body>
</html>
